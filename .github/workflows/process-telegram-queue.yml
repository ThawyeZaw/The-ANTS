name: Process Telegram Notification Queue

on:
  schedule:
    - cron: '* * * * *'        # Every minute
  workflow_dispatch:            # Manual trigger for testing

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Call queue processor API
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://the-ants.org/api/cron/process-notifications"
